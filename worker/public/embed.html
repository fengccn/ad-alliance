<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博盟广告位</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #aa-wrap {
    display: flex; align-items: stretch; gap: 2px;
    width: 402px; max-width: 100%; height: 100px;
    overflow: hidden; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #aa-left  { flex: 0 0 100px; width: 100px; height: 100px; overflow: hidden; background: #f1f3f4; }
  #aa-right { flex: 1 1 auto;  min-width: 0; height: 100px; overflow: hidden; background: #f1f3f4; }
  #aa-wrap a  { display: block; width: 100%; height: 100%; text-decoration: none; }
  #aa-wrap img{ display: block; width: 100%; height: 100%; object-fit: cover; border: 0; }
  #aa-empty   { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;
                font-size: 11px; color: #999; text-align: center; line-height: 1.5; }

  /* ---------- RSS 文章广告 ---------- */
  .aa-rss {
    position: relative; display: flex; flex-direction: column; justify-content: center;
    width: 100%; height: 100%; padding: 9px 14px; box-sizing: border-box;
    overflow: hidden; border: 1px solid rgba(0,0,0,.07); border-radius: 2px;
  }
  .aa-rss::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.50), rgba(255,255,255,0));
  }
  .aa-rss .aa-link { position: relative; z-index: 1; text-decoration: none; -webkit-tap-highlight-color: transparent; display: block; width: auto; height: auto; }
  .aa-rss .aa-site {
    height: 22px; line-height: 22px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .aa-rss .aa-label { font-size: 11.5px; color: #8d8d8d; font-weight: 400; letter-spacing: .5px; }
  .aa-rss .aa-name {
    font-size: 15.5px; font-weight: 700; letter-spacing: .3px;
    background: linear-gradient(92deg, #0b57d0, #8a3ffc, #0b57d0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .aa-rss .aa-post {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 35px; margin-top: 5px; text-align: center; font-size: 12px; line-height: 1.45;
    background: linear-gradient(90deg, #0f766e, #1a73e8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .aa-rss a:hover { animation: aaRssBreath 1.8s ease-in-out infinite; }
  @keyframes aaRssBreath {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 0 rgba(26,115,232,0)); }
    50% { opacity: .84; filter: drop-shadow(0 0 5px rgba(26,115,232,.45)); }
  }

  /* 宣纸：米白底 + 两层细纤维颗粒 */
  .aa-theme-rice {
    background-color: #faf7ef;
    background-image:
      radial-gradient(rgba(140,105,60,.10) 1px, transparent 1.2px),
      radial-gradient(rgba(140,105,60,.06) 1px, transparent 1.2px),
      linear-gradient(180deg, #fffdf7, #f4efe1);
    background-size: 13px 13px, 9px 9px, 100% 100%;
    background-position: 0 0, 5px 6px, 0 0;
  }
  /* 卡纸：暖白 + 极细横纹 */
  .aa-theme-card {
    background-color: #f6f4f0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.030) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #fbfaf7, #eeeae2);
  }
  /* 格纹：浅青方格 */
  .aa-theme-grid {
    background-color: #f7faf9;
    background-image:
      linear-gradient(rgba(15,118,110,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,118,110,.075) 1px, transparent 1px);
    background-size: 12px 12px;
  }
  /* 点纹：淡蓝圆点 */
  .aa-theme-dot {
    background-color: #f5f9ff;
    background-image: radial-gradient(rgba(26,115,232,.16) 1.4px, transparent 1.6px);
    background-size: 9px 9px;
  }
</style>
</head>
<body>
<!-- 双栏广告位：左 100x100 平台广告 + 右 300x100 伙伴广告（图片或 RSS 文章） -->
<div id="aa-wrap" style="display:none;">
  <div id="aa-left"></div>
  <div id="aa-right"></div>
</div>

<script>
/* 博盟 iframe 广告位 —— 纯 HTML 嵌入（无外部 JS，隔离运行）。
 * 访问方式：/embed.html?site_id=你的站点ID
 * 参与站点嵌入（纯 HTML，无 <script>）：
 *   <iframe src="https://blogunion.880200.xyz/embed.html?site_id=你的站点ID"
 *           width="402" height="100" frameborder="0" scrolling="no"
 *           style="border:0;display:block;margin:10px auto;max-width:100%"></iframe>
 */
(function () {
  'use strict';
  var siteId = new URLSearchParams(location.search).get('site_id');
  var base = location.origin; // 同域，自动取当前页面域名
  if (!siteId) return;

  var wrap = document.getElementById('aa-wrap');
  var left = document.getElementById('aa-left');
  var right = document.getElementById('aa-right');

  function makeAd(href, imgSrc) {
    var a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener nofollow sponsored';
    a.title = '赞助商广告';
    var img = document.createElement('img');
    img.src = imgSrc;
    img.alt = '广告';
    img.loading = 'lazy';
    a.appendChild(img);
    return a;
  }

  // RSS 文章广告：上「推荐博客：站点名」，下居中最新文章标题（最多两行），均走 /click 统计
  function makeRssAd(p) {
    var theme = /^(rice|card|grid|dot)$/.test(p.theme || '') ? p.theme : 'rice';
    var box = document.createElement('div');
    box.className = 'aa-rss aa-theme-' + theme;

    var a1 = document.createElement('a');
    a1.className = 'aa-link aa-site';
    a1.href = p.site_click_url || p.site_url || '#';
    a1.target = '_blank';
    a1.rel = 'noopener nofollow sponsored';
    a1.title = '访问该站点';

    var label = document.createElement('span');
    label.className = 'aa-label';
    label.textContent = '推荐博客：';

    var name = document.createElement('span');
    name.className = 'aa-name';
    name.textContent = p.site_name || '';

    a1.appendChild(label);
    a1.appendChild(name);

    var a2 = document.createElement('a');
    a2.className = 'aa-link aa-post';
    a2.href = p.article_click_url || p.article_url || '#';
    a2.target = '_blank';
    a2.rel = 'noopener nofollow sponsored';
    a2.title = '阅读最新文章';
    a2.textContent = p.article_title || '最新文章';

    box.appendChild(a1);
    box.appendChild(a2);
    return box;
  }

  fetch(base + '/api/embed?site_id=' + encodeURIComponent(siteId) + '&_t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var hasAny = false;

      // 左侧：平台自身广告（100x100），链接直接指向目标
      if (d.self && d.self.image_url && d.self.target_url) {
        left.appendChild(makeAd(d.self.target_url, d.self.image_url));
        hasAny = true;
      } else {
        left.style.display = 'none'; // 无自身广告，右侧占满整行
      }

      // 右侧：随机伙伴广告（图片 / RSS 文章）
      if (d.partner && d.partner.mode === 'rss' && (d.partner.site_name || d.partner.article_title)) {
        right.appendChild(makeRssAd(d.partner));
        hasAny = true;
      } else if (d.partner && d.partner.image_url && d.partner.click_url) {
        right.appendChild(makeAd(d.partner.click_url, d.partner.image_url));
        hasAny = true;
      } else {
        right.innerHTML = '<span id="aa-empty">暂无联盟内其他会员广告<br>邀请更多博客加入即可互相曝光</span>';
        hasAny = true;
      }

      if (hasAny) wrap.style.display = 'flex';
    })
    .catch(function () { /* 请求失败静默隐藏 */ });
})();
</script>
</body>
</html>
